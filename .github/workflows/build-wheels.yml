name: Build and Release ROCpd Wheels

on:
  push:
    branches:
      - rocpd
  workflow_dispatch:

jobs:
  manylinux-build:
    name: manylinux wheels (Python ${{ matrix.py_ver }})
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/${{ matrix.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { py_ver: '3.6',  py_tag: 'cp36-cp36m', docker_image: 'manylinux2010_x86_64' }
          - { py_ver: '3.9',  py_tag: 'cp39-cp39',   docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.10', py_tag: 'cp310-cp310', docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.11', py_tag: 'cp311-cp311', docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.12', py_tag: 'cp312-cp312', docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.13', py_tag: 'cp313-cp313', docker_image: 'manylinux_2_28_x86_64' }
    steps:
      - name: Install Git
        run: |-
            yum update -y
            yum install -y git
            git clone -b rocpd https://github.com/ammarwa/Babeltrace2-ROCpd-Plugin.git
            git clone -b v2.3.1 https://github.com/efficios/barectf.git

      - name: Install Barectf
        shell: bash
        working-directory: barectf
        env:
            PY_VER: ${{ matrix.py_ver }}
            PY_TAG: ${{ matrix.py_tag }}
        run: |
            set -eox pipefail
            export PYBIN=/opt/python/${PY_TAG}/bin
            export PATH=$PYBIN:$PATH
            $PYBIN/pip install --upgrade pip || true
            $PYBIN/pip install --upgrade virtualenv
            virtualenv --python=python3 virt
            . ./virt/bin/activate
            ./setup.py install

      - name: Build wheel
        shell: bash
        working-directory: Babeltrace2-ROCpd-Plugin
        env:
            PY_VER: ${{ matrix.py_ver }}
            PY_TAG: ${{ matrix.py_tag }}
        run: |
            set -eox pipefail
            if [ ! -x /opt/python/${PY_TAG}/bin/python ]; then
                echo 'Interpreter for ${PY_TAG} not found in image ${DOCKER_IMAGE}; skipping.'
                exit 0
            fi
            export PYBIN=/opt/python/${PY_TAG}/bin
            export PATH=$PYBIN:$PATH
            $PYBIN/pip install --upgrade pip || true
            $PYBIN/pip install build wheel setuptools cmake auditwheel packaging cmake
            ls -lah; ls -lah rocpd
            cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DROCPD_PYTHON_VERSIONS="${PY_VER}" -S $(pwd)/rocpd
            cmake --build build --target rocpd_wheels -j$(nproc)
            ls -R build/dist-${PY_VER}
            if compgen -G 'build/dist-${PY_VER}/*.whl' > /dev/null; then
                mkdir -p build/dist-${PY_VER}/repaired
                for w in build/dist-${PY_VER}/*.whl; do
                    auditwheel repair "${w}" -w build/dist-${PY_VER}/repaired || true
                done
                if compgen -G 'build/dist-${PY_VER}/repaired/*.whl' > /dev/null; then
                    mv build/dist-${PY_VER}/repaired/*.whl build/dist-${PY_VER}
                fi
            fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
            name: wheels-${{ matrix.py_ver }}-${{ matrix.docker_image }}
            path: build/dist-${{ matrix.py_ver }}/*.whl
            if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: manylinux-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display downloaded files
        run: |
          find dist -type f -name '*.whl'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/**/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

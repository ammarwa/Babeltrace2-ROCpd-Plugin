name: Build and Release ROCpd Wheels

on:
  push:
    branches:
      - rocpd
  workflow_dispatch:

jobs:
  build-manylinux:
    name: Build wheels (${{ matrix.py_ver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { py_ver: '3.6',  py_tag: 'cp36-cp36m', docker_image: 'manylinux2010_x86_64' }
          - { py_ver: '3.9',  py_tag: 'cp39-cp39',   docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.10', py_tag: 'cp310-cp310', docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.11', py_tag: 'cp311-cp311', docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.12', py_tag: 'cp312-cp312', docker_image: 'manylinux2014_x86_64' }
          - { py_ver: '3.13', py_tag: 'cp313-cp313', docker_image: 'manylinux_2_28_x86_64' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rocpd

      - name: Build in manylinux container
        env:
          PY_VER: ${{ matrix.py_ver }}
          PY_TAG: ${{ matrix.py_tag }}
          DOCKER_IMAGE: ${{ matrix.docker_image }}
        run: |
          set -euo pipefail
          echo "Building for $PY_VER ($PY_TAG) in $DOCKER_IMAGE"
          docker run --rm \
            -e PY_VER -e PY_TAG \
            -v "$PWD:/io" \
            quay.io/pypa/${DOCKER_IMAGE} /bin/bash -c "set -euo pipefail; \
              if [ ! -x /opt/python/${PY_TAG}/bin/python ]; then echo 'Interpreter ${PY_TAG} missing in image ${DOCKER_IMAGE}; exit 0'; fi; \
              yum install -y git || true; \
              cd /io; \
              PYBIN=/opt/python/${PY_TAG}/bin; \
              \$PYBIN/pip install --upgrade pip; \
              \$PYBIN/pip install --upgrade build wheel setuptools cmake auditwheel packaging; \
              \$PYBIN/pip install 'Cython>=0.29.36,<0.30' || true; \
              \$PYBIN/pip install 'PyYAML==6.0.1' || true; \
              \$PYBIN/pip install 'jsonschema<4.0,>=3.2' || true; \
              \$PYBIN/pip install 'jinja2<4.0,>=3.0' || true; \
              \$PYBIN/pip install 'termcolor>=1.1' || true; \
              \$PYBIN/pip install --no-deps 'barectf>=3.1.0'; \
              export PATH=\"\$PYBIN:\$PATH\"; \
              cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DROCPD_PYTHON_VERSIONS='${PY_VER}' -S rocpd; \
              cmake --build build --target rocpd_wheels -j\$(nproc); \
              ls -R build/dist-${PY_VER} || true; \
              if compgen -G 'build/dist-${PY_VER}/*.whl' > /dev/null; then \
                mkdir -p build/dist-${PY_VER}/repaired; \
                for w in build/dist-${PY_VER}/*.whl; do auditwheel repair "\$w" -w build/dist-${PY_VER}/repaired || true; done; \
                if compgen -G 'build/dist-${PY_VER}/repaired/*.whl' > /dev/null; then mv build/dist-${PY_VER}/repaired/*.whl build/dist-${PY_VER}/; fi; \
              fi; \
            "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.py_ver }}-${{ matrix.docker_image }}
          path: build/dist-${{ matrix.py_ver }}/*.whl
          if-no-files-found: ignore

  release:
    name: Create/Update Rolling Release
    needs: build-manylinux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rocpd

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare tag and release metadata
        id: prep
        run: |
          set -euo pipefail
          TAG_NAME=rocpd-latest
          RELEASE_NAME="ROCPD nightly (branch rocpd)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          # Create or move lightweight tag to this commit
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push origin -f "$TAG_NAME"

      - name: List wheels
        run: find dist -type f -name '*.whl' -print

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ steps.prep.outputs.release_name }}
          files: dist/**/**/*.whl
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
